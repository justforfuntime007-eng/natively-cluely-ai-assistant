name: Build macOS ARM64 (Premium Test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Debug gitlinks
        run: |
          echo "=== .gitmodules ==="
          cat .gitmodules || true

          echo "=== Gitlinks ==="
          git ls-files --stage | grep 160000 || true

      - name: Remove stale natively-api
        run: |
          git rm --cached natively-api || true
          rm -rf .git/modules/natively-api || true
          rm -rf natively-api || true

      - name: Clone premium using GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf premium

          git clone \
            https://x-access-token:${GH_TOKEN}@github.com/Natively-AI-assistant/natively-premium.git \
            premium

          echo "=== PREMIUM CONTENTS ==="
          ls -la premium
          find premium | head -50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron
        run: npm run build:electron

      - name: Build native modules
        run: |
          NATIVELY_BUILD_ALL_MAC_ARCHES=1 npm run build:native

      - name: Fix Sharp dependencies
        run: |
          if [ -f scripts/ensure-sharp-mac-deps.js ]; then
            node scripts/ensure-sharp-mac-deps.js
          fi

      - name: Package app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
        run: |
          ./node_modules/.bin/electron-builder \
            --mac zip \
            --config electron-builder.signed.cjs \
            --publish never

      - name: Show generated files
        if: always()
        run: |
          echo "=== RELEASE FILES ==="
          find release -type f || true

          echo "=== APP FILES ==="
          find . -name "*.app" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natively-macos-build
          path: |
            release/**
            dist/**
            **/*.app
          if-no-files-found: warn
