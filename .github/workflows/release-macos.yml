name: Build macOS ARM64 (Unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust (native module)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          set -euo pipefail

          # Keep original release workflow sequence
          npm run build
          npm run build:electron
          npm run build:native

          node scripts/ensure-sharp-mac-deps.js

      - name: Install create-dmg
        run: |
          which create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Package macOS ARM64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
        run: |
          set -euo pipefail

          # Build unsigned Apple Silicon release only
          npx electron-builder \
            --mac dmg zip \
            --arm64 \
            --publish never

      - name: List generated artifacts
        run: |
          echo "Release contents:"
          find release -type f || true
          find dist -type f || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natively-macos-arm64
          path: |
            release/**
            dist/**
          if-no-files-found: warn
