name: Build macOS ARM64 ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron
        run: npm run build:electron

      - name: Build native modules
        run: |
          export NATIVELY_BUILD_ALL_MAC_ARCHES=0
          npm run build:native

      - name: Fix Sharp macOS dependencies
        run: |
          if [ -f scripts/ensure-sharp-mac-deps.js ]; then
            node scripts/ensure-sharp-mac-deps.js
          fi

      - name: Package ARM64 ZIP only
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
        run: |
          npx electron-builder \
            --mac zip \
            --arm64 \
            --publish never

      - name: Show generated files
        if: always()
        run: |
          echo "===== RELEASE FILES ====="
          find release -type f || true

          echo "===== DIST FILES ====="
          find dist -type f || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natively-macos-arm64
          path: |
            release/**
            dist/**
          if-no-files-found: warn
