name: Build macOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository info
        run: |
          echo "===== .gitmodules ====="
          cat .gitmodules || true

          echo "===== Submodule gitlinks ====="
          git ls-files --stage | grep 160000 || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron
        run: npm run build:electron

      - name: Build native modules
        run: npm run build:native

      - name: Fix Sharp dependencies
        run: node scripts/ensure-sharp-mac-deps.js

      - name: Install create-dmg
        run: |
          which create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Package macOS ARM64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
        run: |
          npx electron-builder --mac --arm64 --publish never

      - name: Show generated files
        run: |
          echo "===== release ====="
          find release -type f || true

          echo "===== dist ====="
          find dist -type f || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natively-macos-arm64
          path: |
            release/**
            dist/**
          if-no-files-found: warn
