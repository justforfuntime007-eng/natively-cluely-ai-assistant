name: Build macOS (Unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust (native module)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Verify premium submodule
        run: |
          echo "=== SUBMODULES ==="
          git submodule status || true

          echo "=== PREMIUM ==="
          ls -la premium || true

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          set -euo pipefail

          npm run build
          npm run build:electron

          NATIVELY_BUILD_ALL_MAC_ARCHES=1 npm run build:native

          node scripts/ensure-sharp-mac-deps.js

      - name: Install create-dmg
        run: |
          which create-dmg >/dev/null 2>&1 || brew install create-dmg

      - name: Package app (no signing / no notarization)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
        run: |
          set -euo pipefail

          ./node_modules/.bin/electron-builder \
            --mac zip \
            --config electron-builder.signed.cjs \
            --publish never

      - name: Show generated files
        if: always()
        run: |
          echo "===== RELEASE FILES ====="
          find release -type f || true

          echo "===== APP BUNDLES ====="
          find release -name "*.app" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natively-macos-build
          path: |
            release/**
            dist/**
          if-no-files-found: warn
